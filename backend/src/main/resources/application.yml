server:
  port: ${PORT:8080}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: strict
        secure: ${COOKIE_SECURE:false}
  error:
    include-message: never
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cage}
    username: ${DB_USER:cage}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  jackson:
    serialization:
      write-dates-as-timestamps: false
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
cage:
  seed: ${DEMO_SEED:false}
  demo-password: ${DEMO_PASSWORD:}
  encryption-key: ${DATA_ENCRYPTION_KEY}
  filing-mode: ${FILING_MODE:mock}
  simulation-controls: ${SIMULATION_CONTROLS:false}
springdoc:
  swagger-ui:
    path: /swagger-ui.html

---
spring:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        max.block.ms: 5000
cage:
  kafka-enabled: ${KAFKA_ENABLED:false}
